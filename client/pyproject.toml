[project]
name = "worldmodel-client"
version = "0.1.0"
description = "Python client and MCP server for the worldmodel app's public API"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
mcp = ["mcp>=1.2"]
pandas = ["pandas>=2"]
test = ["pytest>=8"]

[project.scripts]
worldmodel-mcp = "worldmodel_client.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["worldmodel_client"]
