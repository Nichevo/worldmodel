[project]
name = "worldmodel-data"
version = "0.1.0"
description = "Worldmodel data pipeline: fetch sources, keep every vintage, build and validate the DuckDB warehouse"
requires-python = ">=3.11"
dependencies = [
    "worldmodel-contract",
    "duckdb>=1.1",
    "dbt-core>=1.10",
    "dbt-duckdb>=1.9.4",
    "httpx>=0.27",
    "typer>=0.12",
    "python-dotenv>=1.0",
    "pyyaml>=6",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
worldmodel-data = "worldmodel_data.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["worldmodel_data"]

[tool.uv.sources]
worldmodel-contract = { path = "../contract", editable = true }
