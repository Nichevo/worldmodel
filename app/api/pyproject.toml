[project]
name = "worldmodel-api"
version = "0.1.0"
description = "Worldmodel local API: reads the warehouse, serves the web app and other tools"
requires-python = ">=3.11"
dependencies = [
    "worldmodel-contract",
    "duckdb>=1.1",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
worldmodel-api = "worldmodel_api.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["worldmodel_api"]

[tool.uv.sources]
worldmodel-contract = { path = "../../contract", editable = true }
