[project]
name = "worldmodel-contract"
version = "0.1.0"
description = "Shared schema and catalogues for the worldmodel data pipeline and app"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6", "pydantic>=2.6"]

[project.optional-dependencies]
test = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["worldmodel_contract"]
