# Topic pages (/topic/<id> in the app): a short introduction and the indicators
# that tell the story, in reading order. Indicators that are not loaded are left
# out on the page. `countries` are the lines drawn on each chart besides the world
# (the key countries by default); `map` is the indicator the topic's map shows.

- id: population
  name: Population
  intro: How many people there are, how fast that is changing, and how old they are. Most countries now have fewer children than it takes to replace each generation, so populations are ageing and many will shrink.
  map: tfr
  indicators: [pop_total, pop_growth_rate, tfr, life_expectancy, median_age, pop_share_65_plus, old_age_dependency_ratio, net_migration_rate]

- id: economy
  name: Economy
  intro: How big economies are, how fast they grow and how rich people are on average. Growth swings with the business cycle; income per person shows living standards more than size does.
  map: gdp_per_capita_usd
  indicators: [gdp_growth, gdp_usd, gdp_per_capita_usd, gdp_ppp_per_capita, inflation, unemployment, current_account_gdp]

- id: rates
  name: Interest and exchange rates
  intro: The rates central banks set to steer their economies, and what each currency is worth in US dollars. Policy rates rise to cool inflation and fall to support growth; a currency that buys fewer dollars makes imports dearer.
  map: bis_policy_rate
  indicators: [bis_policy_rate, bis_policy_rate_end, inflation, bis_usd_exchange_rate]

- id: debt
  name: Debt
  intro: What governments, households and companies owe. Debt lets spending run ahead of income; how much is too much depends on interest rates, growth and who holds it.
  map: govt_debt_gdp
  indicators: [govt_debt_gdp, central_govt_debt_gdp, imf_household_debt_gdp, imf_corporate_debt_gdp, external_debt_gni]

- id: prices
  name: Prices and inflation
  intro: How fast prices rise, and how dear a country is compared with others. Inflation erodes savings and wages that do not keep up; price levels show what money buys in each place.
  map: inflation
  indicators: [inflation, price_level_ratio, oecd_house_price_real, oecd_price_to_income_vs_avg]

- id: living
  name: Cost of living and pay
  intro: What things cost and what people earn. Price levels and cost indices show how dear a country is; earnings, the minimum wage and take-home pay show what people have to spend. Pay in PPP dollars buys the same everywhere, so it compares living standards; city figures are on the Cities page.
  map: wn_cost_index
  indicators: [price_level_ratio, wn_cost_index, wn_monthly_cost_usd, ilo_earnings_ppp, ilo_min_wage_ppp, wn_median_net_ppp, wn_take_home_share, wn_rent_index]

- id: housing
  name: Housing
  intro: House prices against incomes and rents, and household debt. Where prices have run ahead of incomes, homes are harder to afford and households borrow more.
  map: oecd_price_to_income_vs_avg
  indicators: [oecd_house_price_real, oecd_price_to_income_vs_avg, oecd_price_to_rent_vs_avg, oecd_household_debt_income, bis_household_credit_gdp]

- id: energy
  name: Energy and emissions
  intro: How much energy countries use, where their electricity comes from and what they emit. The shift from coal, oil and gas to clean power is the largest change in energy since electricity itself.
  map: renewables_share_elec
  indicators: [energy_use_per_capita, electricity_use_per_capita, renewables_share_elec, renewable_share_final_energy, co2_per_capita, co2_emissions_total]

- id: migration
  name: Migration
  intro: People moving between countries, and people forced to flee. Migration adds to the working-age population in rich countries and sends money home to poorer ones.
  map: migrant_stock_share
  indicators: [net_migration, net_migration_rate, migrant_stock_share, refugees_hosted, refugees_by_origin, remittances_received_gdp]

- id: education
  name: Education
  intro: How much schooling people get, and how much countries spend on it. Years of schooling have risen almost everywhere since 1950, and fastest for women.
  map: tertiary_enrolment
  indicators: [literacy_rate, secondary_enrolment, tertiary_enrolment, education_spending_gdp, rd_spending_gdp]

- id: health
  name: Health
  intro: How long people live and what they die of. Child deaths have fallen faster than anyone expected fifty years ago; spending on health varies far more than life expectancy does.
  map: life_expectancy
  indicators: [life_expectancy, infant_mortality, under5_mortality, health_spending_gdp, physicians_per_1000]

- id: military
  name: Military
  intro: What countries spend on their armed forces and how many people serve. Spending as a share of GDP shows the burden; in dollars it shows the might.
  map: military_spending_gdp
  indicators: [military_spending_gdp, military_spending_usd, armed_forces, arms_exports, arms_imports]

- id: ai
  name: AI use
  intro: How much people and firms use artificial intelligence. The figures come from different angles, firms surveyed by Eurostat, users counted by Microsoft and Claude conversations measured by Anthropic, so each covers different countries and they do not add up to one number. All are new and short, and change fast.
  map: ai_use_population
  indicators: [ai_use_population, ai_use_enterprises, ai_claude_use_per_capita_index, ai_claude_use_share, internet_users_share, rd_spending_gdp]

- id: internet
  name: Internet
  intro: How many people are online and how fast their connections are. Speeds are from Speedtest by Ookla tests summed by country, fixed broadband and mobile apart; they show what people who test get, which is not everyone. Users and subscriptions are the ITU's counts.
  map: internet_fixed_down_mbps
  indicators: [internet_fixed_down_mbps, internet_mobile_down_mbps, internet_users_share, broadband_subscriptions_per_100, mobile_subscriptions_per_100, internet_fixed_latency_ms, internet_mobile_latency_ms]

- id: nz
  name: New Zealand in detail
  intro: The New Zealand pack's own figures, from the Reserve Bank, MBIE, the Electoral Commission and the Department of Corrections, beside the international series. Switch the pack on or off in Settings.
  map: bis_policy_rate
  indicators: [rbnz_ocr, rbnz_mortgage_floating, rbnz_mortgage_2y, rbnz_govt_bond_10y, rbnz_nzd_usd, rbnz_twi, nz_energy_primary_supply, nz_energy_renewable_share_primary, nz_energy_use_transport, nz_turnout, nz_turnout_maori, nz_prisoners_total, nz_prisoners_remand_accused]

- id: voting
  name: Voting
  intro: How many people vote, and who. Turnout has fallen in many countries since the 1980s; everywhere it is lower among the young, and in the US among people who are not white. Turnout counts votes against registered voters; the share of the voting-age population also counts people who never registered.
  map: turnout_parliamentary
  indicators: [turnout_parliamentary, vap_turnout_parliamentary, turnout_presidential, us_voted, us_voted_age_18_24, us_voted_age_65_plus, nz_turnout, nz_turnout_age_18_24, nz_turnout_age_70_plus]


- id: inequality
  name: Inequality
  intro: How unequally income and wealth are shared. The Gini index runs from 0 (everyone the same) to 100 (one person has everything) and comes from household surveys; the World Inequality Database adds tax records and national accounts, which catch the top incomes surveys miss, so its top shares run higher. Wealth is always far less equal than income.
  map: wid_income_top1
  indicators: [gini, wid_income_top1, wid_income_top10, wid_wealth_top1, wid_wealth_top10, wid_palma, income_share_top10, income_share_bottom20]

- id: values
  name: Values
  intro: What people say they believe, from the World Values Survey, asked in waves about every five years since 1981. Trust in other people tends to be high where institutions work and inequality is low; religion matters less to people in most rich countries than it did a generation ago. Each wave covers a different set of countries, so lines have gaps.
  map: wvs_trust
  indicators: [wvs_trust, wvs_happy, rel_none_share, women_in_parliament]

- id: science
  name: Science and technology
  intro: How much countries spend on research, how many researchers they have, and what comes out of it in papers and patents. Spending on research and development is the steadiest measure; papers and patents are counted where the authors and inventors live, and counts favour large countries, so the per-person figures compare better.
  map: rd_spending_gdp
  indicators: [rd_spending_gdp, researchers_per_million, science_articles_per_million, journal_articles, patents_per_million, patent_applications_resident, patent_applications_nonresident, high_tech_share_exports, ip_receipts_usd, ai_publications_per_million]

- id: crises
  name: Financial crises
  intro: Two centuries of banking crises, defaults, currency crashes and runaway inflation, from Reinhart and Rogoff's crisis years. Crises come in waves (the 1830s, 1870s, 1890s, 1930s, 1980s and 2008) and often together, a banking crisis leading to a default or a currency crash. Each crisis is 1 in a year it was under way and 0 when not; the count adds up the kinds at once. The Financial crises page shows them as strips by country.
  map: crisis_kinds
  indicators: [crisis_kinds, crisis_banking, crisis_default_external, crisis_default_domestic, crisis_currency, crisis_inflation, rr_inflation, govt_debt_gdp]
