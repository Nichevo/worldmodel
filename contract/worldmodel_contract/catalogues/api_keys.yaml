# API key and rate-limit register.
#
# Keys live in a local .env file at the repo root (copy .env.example), never in
# git. `worldmodel-data keys` and the app's Data status page ("Keys you can add")
# show which are set without printing them. `unlocks` says, in plain words, what
# the key adds to the app; `status` is active (used now) or planned (used once the
# connector is built; get it ahead if you like).
# Limits are from each provider's documentation as last known; check them when
# a connector is built, and keep connectors under them so a refresh does not
# fail halfway.

- source: un_wpp
  name: UN World Population Prospects (bulk CSV)
  env: []
  needs_key: false
  limits: Static file downloads, about 100 MB per release.
  status: active

- source: imf_weo
  name: IMF DataMapper API
  env: []
  needs_key: false
  limits: No published limit. The connector waits 1 second between requests and sends a User-Agent.
  status: active

- source: world_bank_wdi
  name: World Bank WDI bulk download (WDI_CSV.zip)
  env: []
  needs_key: false
  limits: No key. One zip file of every series; downloaded again only when it has changed. If the download
    server refuses it, the main series (about 150) come from the Indicators API (api.worldbank.org), one
    request per series, 0.3 seconds apart.
  status: active

- source: owid_energy
  name: Our World in Data energy dataset on GitHub
  env: []
  needs_key: false
  limits: No key. One CSV file and its codebook from raw.githubusercontent.com.
  status: active

- source: owid_grapher
  name: Our World in Data chart downloads
  env: []
  needs_key: false
  limits: No key. One CSV and one metadata file per chart, a few charts, with a pause between them.
  status: active

- source: statsnz
  name: Stats NZ Aotearoa Data Explorer API
  env: [STATSNZ_API_KEY]
  needs_key: true
  signup: https://portal.apis.stats.govt.nz/
  how: Sign up on the API portal, subscribe to the Aotearoa Data Explorer product, and copy the subscription key.
  unlocks: New Zealand's 16 regions on the NZ page (population, census 2013, 2018 and 2023, regional GDP).
  limits: Free; per-key rate limits on the portal. Read every 30 days, about ten tables.
  status: active

- source: gie_agsi
  name: GIE gas storage (AGSI+) and LNG (ALSI) API
  env: [GIE_API_KEY]
  needs_key: true
  signup: https://agsi.gie.eu/
  how: Register on the site; the key is on your account page.
  unlocks: European gas storage and LNG stocks day by day, on the Storage page's clock charts.
  limits: Free; about 60 requests a minute. The first refresh reads every year since 2011 (about 10 minutes); later ones only the current year.
  status: active

- source: eia
  name: US EIA Open Data API
  env: [EIA_API_KEY]
  needs_key: true
  signup: https://www.eia.gov/opendata/register.php
  how: Fill in the form; the key arrives by email.
  unlocks: US gas storage, crude oil, Strategic Petroleum Reserve and fuel stocks week by week, on the Storage page.
  limits: Free key; about 5,000 rows per request. Six series, read every three days.
  status: active


- source: us_acs
  name: US Census Data API (American Community Survey)
  env: [CENSUS_API_KEY]
  needs_key: true
  signup: https://api.census.gov/data/key_signup.html
  how: Give your organisation name ("personal" is fine) and email; the key arrives by email and must be activated from the link in it.
  unlocks: Income, poverty, degrees, home values, rents, inequality, age, born abroad and language for every US state and county (2009 onward).
  limits: Free. The API no longer answers without a key. One refresh asks about 260 questions the first time, about 40 after.
  status: active

- source: bls_laus_county
  name: BLS Public Data API (county unemployment)
  env: [BLS_API_KEY]
  needs_key: false
  signup: https://data.bls.gov/registrationEngine/
  how: Optional. Give your organisation ("personal" is fine) and email; the key arrives by email and must be
    activated from the link in it. Without it the app tries BLS's yearly county files, which BLS's firewall often
    turns away (then save them by hand in var\manual\bls_laus_county).
  unlocks: Unemployment rates for every US county, 1990 onward, without saving the yearly files by hand.
  limits: Free; 500 questions a day. One refresh asks about 130 the first time and about 65 after, half a second apart,
    once a month.
  status: active

- source: iucn_redlist
  name: IUCN Red List API (v4)
  env: [IUCN_API_KEY]
  needs_key: true
  signup: https://api.iucnredlist.org/users/sign_up
  how: Sign up with an email address, say what the key is for (personal research), and copy the token from your account page.
  unlocks: Threatened and extinct species counts for New Zealand, Australia, the US and the UK, and the critically endangered species by name, on the Nature tab and country Nature cards.
  limits: Free for non-commercial use. About 400 requests per refresh, a second apart, twice a year.
  status: active

- source: eppo_pests
  name: EPPO Global Database API
  env: [EPPO_API_KEY]
  needs_key: true
  signup: https://data.eppo.int/
  how: Register (free), then copy the authtoken shown on your account page.
  unlocks: Where each watched pest and plant disease is found (stink bug, fruit flies, Xylella, myrtle rust...), on the Nature tab and country Nature cards.
  limits: Free; 12 requests per refresh, a second apart, every three months.
  status: active

- source: un_comtrade
  name: UN Comtrade API
  env: [COMTRADE_API_KEY]
  needs_key: true
  signup: https://comtradedeveloper.un.org/
  how: Sign in, subscribe to the free "comtrade - v1" product, and copy the primary key.
  unlocks: Recent monthly trade between countries (optional; yearly trade comes from BACI without a key).
  limits: Free tier about 500 calls a day and 100,000 records per call; bulk files need a subscription.
  status: optional, not used yet

- source: acled
  name: ACLED API (myACLED account)
  env: [ACLED_EMAIL, ACLED_PASSWORD]
  needs_key: true
  signup: https://acleddata.com/register/
  how: Register a free myACLED account and confirm it. ACLED's API signs in with the account's email and password, so
    both go in .env (or Settings > Keys). The password then sits in .env in plain text, like the other keys, and in
    backups of .env. If you would rather not keep it there, leave these blank and save CSV exports from ACLED's Data
    Export Tool in var\manual\acled instead.
  unlocks: Located battles, explosions, attacks on civilians, protests and riots week by week on the map, the country
    page's fighting-by-month card and the CrisisWatch month detail, and yearly protest and riot counts. UCDP covers
    deadly fighting without a key.
  limits: Free accounts for non-commercial use; since 2025 a free account may only read some years or less detail.
    Read 5,000 events a page, two seconds apart, a year at a time.
  status: active

- source: cloudflare_radar
  name: Cloudflare Radar API
  env: [CLOUDFLARE_API_TOKEN]
  needs_key: true
  signup: https://dash.cloudflare.com/profile/api-tokens
  how: Optional. Sign up for a free Cloudflare account, create an API token with the "Radar read" permission (a custom
    token; no website or payment needed) and copy it.
  unlocks: Internet outages checked by Cloudflare's staff, with their cause (a government order, a cable cut, power,
    weather, war), beside IODA's detected outages.
  limits: Free; one request a year of outages, every two days.
  status: active

- source: ember
  name: Ember API
  env: [EMBER_API_KEY]
  needs_key: true
  signup: https://ember-energy.org/data/api/
  unlocks: Monthly electricity generation by fuel (optional; yearly figures come from Our World in Data).
  limits: Free key.
  status: optional, not used yet

- source: fred
  name: FRED API (St. Louis Fed)
  env: [FRED_API_KEY]
  needs_key: true
  signup: https://fred.stlouisfed.org/docs/api/api_key.html
  unlocks: US interest rates, markets and money figures (optional).
  limits: About 120 requests a minute.
  status: optional, not used yet

- source: assistant
  name: Local AI (Ollama)
  env: []
  needs_key: false
  limits: Runs on this PC (or another on the network); its address and default model are app settings
    (Settings, Local AI). The app's server talks to it.
  status: active

- source: brave_search
  name: Brave Search API (web search for the local AI)
  env: [BRAVE_API_KEY]
  needs_key: true
  signup: https://brave.com/search/api/
  unlocks: Web search for Ask AI (SearXNG on this PC is the free alternative).
  limits: Paid. $5 of credit a month (about 1,000 searches), then about $5 per 1,000. The app counts every
    search and holds to the daily and monthly limits in Settings (default 30 a day). SearXNG, run locally, is
    the free alternative (no key).
  status: active

- source: assistant_cloud
  name: Optional cloud model for the assistant
  env: [ANTHROPIC_API_KEY]
  needs_key: true
  signup: https://console.anthropic.com/
  unlocks: A cloud model for Ask AI (optional; the local Ollama models need no key).
  limits: Pay per use; only if a cloud model is switched on.
  status: optional, not used yet

- source: live_ships
  name: aisstream.io (ships' positions now, by AIS)
  env: [AISSTREAM_API_KEY]
  needs_key: true
  signup: https://aisstream.io/authenticate
  how: Sign in with a GitHub account, open API Keys and create a key.
  unlocks: The map's "Ships now" layer and the ships collector (Settings > Transport), which saves ships' positions for the map's time slider, tracks and the Ships table.
  limits: Free. One websocket at a time; the collector keeps one open for its area and opens a second for a short whole-world snapshot every few hours.
  status: active

- source: ship_owners_gfw
  name: Global Fishing Watch (ship owners, flags and registries)
  env: [GFW_API_TOKEN]
  needs_key: true
  signup: https://globalfishingwatch.org/our-apis/tokens
  how: Make a free Global Fishing Watch account, open API access tokens, and request a token for non-commercial use.
  unlocks: "Owner and builder in a ship's details (Ships and planes page): registered owners, flag history, registry details and authorisations, mostly for fishing boats and the carriers that serve them."
  limits: Free for non-commercial use. Asked once per ship when its details are opened, and kept for 30 days.
  status: active

- source: carrier_schedules_maersk
  name: Maersk Commercial Schedules API (DCSA)
  env: [MAERSK_CONSUMER_KEY]
  needs_key: true
  signup: https://developer.maersk.com/
  how: Register on the Maersk Developer Portal, create an app, add the Commercial Schedules (DCSA) product and copy its Consumer Key. Maersk marks it "available for Maersk Ocean customers", so it may not be granted to a private account.
  unlocks: "Live > Schedules and a ship's Schedule part: each Maersk ship's planned port calls, so the app can say how late it is against Maersk's own schedule."
  limits: Free. Asked for Maersk ships seen in the last two days, at most 30 ships an hour, each again after 12 hours.
  status: active

- source: carrier_schedules_hlag
  name: Hapag-Lloyd schedules API (DCSA Commercial Schedules)
  env: [HLAG_CLIENT_ID, HLAG_CLIENT_SECRET]
  needs_key: true
  signup: https://api-portal.hlag.com/
  how: Register on the Hapag-Lloyd API Developer Portal, create an app subscribed to the Commercial Schedules API, and copy its client id and secret.
  unlocks: Planned port calls of Hapag-Lloyd ships, for the on-time measure.
  limits: Free. Same pace as Maersk.
  status: active

- source: carrier_schedules_cmacgm
  name: CMA CGM schedules API (DCSA Commercial Schedules)
  env: [CMACGM_API_KEY]
  needs_key: true
  signup: https://api-portal.cma-cgm.com/
  how: Register on the CMA CGM API portal, subscribe an app to the commercial schedules API, and copy its key.
  unlocks: Planned port calls of CMA CGM, ANL and APL ships, for the on-time measure.
  limits: Free. Same pace as Maersk.
  status: active

- source: port_list_singapore
  name: Singapore MPA vessel arrivals and departures (OCEANS-X)
  env: [SG_OCEANSX_API_KEY]
  needs_key: true
  signup: https://oceans-x.mpa.gov.sg/
  how: Sign up on OCEANS-X (email and two-step sign-in), create an application, subscribe it to Vessels Due to Arrive,
    Vessel Arrivals and Vessels Due to Depart, then Production Keys > Generate Key (shown once). If an API's page shows
    a different address, put it in .env as SG_DUE_TO_ARRIVE_URL, SG_ARRIVALS_URL or SG_DUE_TO_DEPART_URL ({date} for the day).
  unlocks: "Singapore in Live > Schedules and in ships' Schedule part: ships due, arrived and due to leave, for the on-time measure."
  limits: Free; 10 requests a minute shared across the application. The app asks four times an hour.
  status: active

- source: live_cameras_windy
  name: Windy Webcams API (beach, surf, harbour and city webcams worldwide)
  env: [WINDY_WEBCAMS_API_KEY]
  needs_key: true
  signup: https://api.windy.com/keys
  how: Sign in to Windy (free), open API keys, create a key and pick the Webcams API (free tier).
  unlocks: Webcams worldwide on the map's "Cameras" layer, the most watched plus beaches and coasts in the area in view,
    with a live or day-timelapse player when one is clicked. The road agencies' cameras show without it.
  limits: Free tier for personal use; up to 50 webcams a request, picture links last ten minutes. The app asks only
    while the layer is on, twice per area, and keeps the answer nine minutes.
  status: active

- source: live_cameras_nsw
  name: Transport for NSW Open Data (Live Traffic NSW cameras)
  env: [TFNSW_API_KEY]
  needs_key: true
  signup: https://opendata.transport.nsw.gov.au/
  how: Sign up (free), create an application in your account and copy its API key.
  unlocks: New South Wales traffic cameras on the map's "Cameras" layer.
  limits: Free. The camera list is read only when the view reaches NSW, and kept six hours.
  status: active

- source: live_cameras_qld
  name: QLDTraffic GeoJSON API (Queensland traffic cameras)
  env: [QLDTRAFFIC_API_KEY]
  needs_key: false
  signup: https://qldtraffic.qld.gov.au/more/Developers-and-Data/
  how: Optional. Without it the app uses the public key in QLDTraffic's API specification, which is shared and often
    busy; ask Transport and Main Roads for a key of your own (the specification says how).
  unlocks: Queensland traffic cameras on the map's "Cameras" layer when the shared key is busy.
  limits: Free. The camera list is read only when the view reaches Queensland, and kept six hours.
  status: active

- source: live_planes
  name: OpenSky Network (planes' positions now)
  env: [OPENSKY_CLIENT_ID, OPENSKY_CLIENT_SECRET]
  needs_key: false
  signup: https://opensky-network.org/my-opensky/account
  how: Optional. Without an account the map's "Planes now" layer still works with fewer requests a day; with one,
    create an API client on your account page and copy its client id and secret.
  unlocks: More requests a day for the map's "Planes now" layer.
  limits: Without an account 400 credits a day (a view the size of a country costs 1 to 3); with one 4,000. The app
    asks at most once every 60 seconds and only while the layer is on.
  status: active

- source: metaculus
  name: Metaculus API
  env: [METACULUS_TOKEN]
  needs_key: true
  signup: https://www.metaculus.com/accounts/settings/
  how: Sign in to Metaculus (free), open your account settings, and copy the API token. For a bot account, its own
    token can go in METACULUS_BOT_TOKEN as well (optional).
  unlocks: Metaculus questions, the community forecast over time and comments on the Crowd page, and your own Metaculus
    forecasts scored on the Predictions page.
  limits: Read one request at a time, a second apart; about 50 to 150 requests a refresh.
  status: active

- source: grid_now_au
  name: Open Electricity (Australia's grid now)
  env: [OPENELECTRICITY_API_KEY]
  needs_key: true
  signup: https://platform.openelectricity.org.au
  how: Sign in, open API keys and create a key.
  unlocks: "The Grid now card for Australia (the National Electricity Market): generation by fuel for the last two days."
  limits: Free for personal use. Asked only while the card is open, at most every five minutes.
  status: active
