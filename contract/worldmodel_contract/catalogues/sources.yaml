# Data sources. `status: active` sources have a connector; `planned` ones are
# listed so licences and keys are known up front (see data/api_keys.yaml).
# Licence notes need a check against each provider's current terms. Worldmodel
# is a personal tool, so non-commercial terms are fine; `commercial_use` marks
# what would need swapping if that ever changes.

- id: un_wpp
  name: UN World Population Prospects
  short_name: UN WPP
  publisher: United Nations, Department of Economic and Social Affairs, Population Division
  url: https://population.un.org/wpp/
  licence: CC BY 3.0 IGO
  licence_url: https://creativecommons.org/licenses/by/3.0/igo/
  commercial_use: true
  cadence: Every 2 years (WPP 2024 released 2024-07-11)
  attribution: "United Nations, DESA, Population Division (2024). World Population Prospects 2024."
  status: active
  default_rank: 1

- id: imf_weo
  name: IMF World Economic Outlook
  short_name: IMF WEO
  publisher: International Monetary Fund
  url: https://data.imf.org/en/datasets/IMF.RES:WEO
  licence: IMF copyright and usage terms (free use with attribution)
  licence_url: https://www.imf.org/external/terms.htm
  commercial_use: true
  cadence: Twice a year (April and October)
  attribution: "International Monetary Fund, World Economic Outlook database."
  status: active
  default_rank: 1

- id: imf_weo_history
  name: IMF WEO historical forecasts
  short_name: IMF WEO past forecasts
  publisher: International Monetary Fund
  url: https://data.imf.org/en/datasets/IMF.RES:WEO
  licence: IMF copyright and usage terms (free use with attribution)
  licence_url: https://www.imf.org/external/terms.htm
  commercial_use: true
  cadence: After each WEO (April and October); one file with every release since 1990
  attribution: "International Monetary Fund, World Economic Outlook historical forecasts database."
  status: active
  default_rank: 5

- id: world_bank_wdi
  name: World Bank World Development Indicators
  short_name: WDI
  publisher: World Bank
  url: https://databank.worldbank.org/source/world-development-indicators
  licence: CC BY 4.0
  licence_url: https://creativecommons.org/licenses/by/4.0/
  commercial_use: true
  cadence: Several updates a year (the bulk file is replaced in place)
  attribution: "World Bank, World Development Indicators."
  status: active
  default_rank: 2

- id: owid_energy
  name: Our World in Data energy dataset (Ember, Energy Institute, EIA)
  short_name: OWID energy
  publisher: Our World in Data, compiling Ember, the Energy Institute Statistical Review of World Energy and the US EIA
  url: https://github.com/owid/energy-data
  licence: CC BY 4.0 (OWID); underlying data from Ember (CC BY 4.0), Energy Institute and EIA, free with attribution
  licence_url: https://creativecommons.org/licenses/by/4.0/
  commercial_use: true
  cadence: Several times a year (after each Ember and Energy Institute release)
  attribution: "Our World in Data, Energy dataset, based on Ember (Yearly Electricity Data), the Energy Institute Statistical Review of World Energy and the U.S. Energy Information Administration."
  status: active
  default_rank: 2

- id: owid_grapher
  name: Our World in Data charts (conflict deaths from UCDP, and other single charts)
  short_name: OWID charts
  publisher: Our World in Data, compiling the Uppsala Conflict Data Program (UCDP) and others
  url: https://ourworldindata.org/war-and-peace
  licence: CC BY 4.0 (OWID); UCDP data free with attribution
  licence_url: https://creativecommons.org/licenses/by/4.0/
  commercial_use: true
  cadence: Yearly for UCDP (each June); OWID updates its charts after each release
  attribution: "Our World in Data, based on the Uppsala Conflict Data Program (UCDP) and the other sources each chart names."
  status: active
  default_rank: 3

- id: worldmodel
  name: Worldmodel aggregates
  short_name: Worldmodel
  publisher: This app
  url: ""
  licence: Inherits the licence of the source it aggregates
  licence_url: ""
  commercial_use: true
  cadence: Every warehouse build
  attribution: "Aggregated by worldmodel from the member countries' source values."
  status: active
  default_rank: 9
