  url: https://data.imf.org/en/datasets/IMF.RES:WEO
  licence: IMF copyright and usage terms (free use with attribution)
  licence_url: https://www.imf.org/external/terms.htm
  commercial_use: true
  cadence: Twice a year (April and October)
  attribution: "International Monetary Fund, World Economic Outlook database."
  status: active
  default_rank: 1

