# The Long history page: what it compares, and the few things typed by hand.
#
# Years are whole numbers, negative for BC (no year 0). Borders come from Seshat's
# Cliopatria (source cliopatria): each power lists the Cliopatria names that make it up;
# in any year the largest of them alive that year is the power's shape and size (the
# composites in brackets join an empire's parts, so they win where they exist).

powers:
  # Powers then
  - {id: rome, name: Rome, era: then, entity: ITA, colour: "#b5523b", wikipedia: Roman Empire,
     polities: [Roman Republic, Roman Empire, Western Roman Empire]}
  - {id: han, name: Han China, era: then, group: china, entity: CHN, colour: "#c9792b", wikipedia: Han dynasty,
     polities: [Han Dynasty]}
  - {id: tang, name: Tang China, era: then, group: china, entity: CHN, colour: "#d39b2a", wikipedia: Tang dynasty,
     polities: [Tang Dynasty]}
  - {id: song, name: Song China, era: then, group: china, entity: CHN, colour: "#b38a3d", wikipedia: Song dynasty,
     polities: [Northern Song, Southern Song]}
  - {id: ming, name: Ming China, era: then, group: china, entity: CHN, colour: "#e0a33a", wikipedia: Ming dynasty,
     polities: [Ming Dynasty]}
  - {id: qing, name: Qing China, era: then, group: china, entity: CHN, colour: "#a7652a", wikipedia: Qing dynasty,
     polities: [Qing Dynasty]}
  - {id: mughal, name: Mughal Empire, era: then, entity: IND, colour: "#3f8f6b", wikipedia: Mughal Empire,
     polities: [Mughal Empire]}
  - {id: ottoman, name: Ottoman Empire, era: then, entity: TUR, colour: "#8a3d6b", wikipedia: Ottoman Empire,
     polities: [Ottoman Empire]}
  - {id: spain, name: Spain, era: then, entity: ESP, colour: "#c4a000", wikipedia: Spanish Empire,
     polities: [(Spanish Empire), Spanish Empire, (Personal union of Crown of Aragon with Crown of Castile)]}
  - {id: netherlands, name: Netherlands, era: then, entity: NLD, colour: "#e06c1f", wikipedia: Dutch Empire,
     polities: [(Dutch Republic), Dutch Republic, (Netherlands), Netherlands]}
  - {id: britain, name: Britain, era: then, entity: GBR, colour: "#2f5f9e", wikipedia: British Empire,
     polities: [(Kingdom of England), Kingdom of England, (British Empire), Kingdom of Great Britain]}
  - {id: soviet, name: Soviet Union, era: then, entity: RUS, colour: "#a3262a", wikipedia: Soviet Union,
     polities: [Republics of the Soviet Union, Union of Soviet Socialist Republics]}
  # Powers now
  - {id: usa, name: United States, era: now, entity: USA, colour: "#1f4e8c", wikipedia: United States,
     polities: [United States of America]}
  - {id: china, name: China, era: now, group: china, entity: CHN, colour: "#c0392b", wikipedia: China,
     polities: [People's Republic of China]}
  - {id: eu, name: European Union, era: now, entity: eu, colour: "#2b6cb0", wikipedia: European Union, polities: []}
  - {id: russia, name: Russia, era: now, entity: RUS, colour: "#7b3f99", wikipedia: Russia,
     polities: [(Russian Federation), Russian Federation]}
  - {id: india, name: India, era: now, entity: IND, colour: "#2e8b57", wikipedia: India,
     polities: [Republic of India]}

