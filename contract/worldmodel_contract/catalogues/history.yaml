# Eight regions for the "who ruled where" strips and the regional population lines.
# A state counts in the region holding the centre of its largest piece (boxes are tried in
# order: west, south, east, north in degrees). Countries count by UN M49 groups.
regions:
  - {id: mena, name: Middle East and North Africa,
     boxes: [[-18, 15, 11, 37.5], [11, 15, 26, 34], [26, 12, 63, 42]],
     groups: [western-asia, northern-africa], add: [IRN], drop: [SDN]}
  - {id: europe, name: Europe, boxes: [[-32, 34, 45, 72]], groups: [europe], drop: [RUS]}
  - {id: south_asia, name: South Asia, boxes: [[60, 5, 92, 37]], groups: [southern-asia], drop: [IRN]}
  - {id: southeast_asia, name: Southeast Asia, boxes: [[92, -11, 141, 23]], groups: [south-eastern-asia]}
  - {id: east_asia, name: East Asia, boxes: [[97, 18, 150, 55]], groups: [eastern-asia]}
  - {id: central_asia_russia, name: Central Asia and Russia, boxes: [[45, 35, 180, 82], [26, 55, 45, 82]],
     groups: [central-asia], add: [RUS]}
  - {id: africa, name: Sub-Saharan Africa, boxes: [[-20, -36, 55, 15]], groups: [sub-saharan-africa], add: [SDN]}
  - {id: americas, name: The Americas, boxes: [[-170, -56, -30, 84]], groups: [americas]}
# Shown as a short strip with a note: Cliopatria has the Pacific only from the 1870s.
pacific:
  id: pacific
  name: The Pacific
  boxes: [[110, -50, 180, -10], [130, -12, 180, 25], [-180, -50, -120, 30]]
  groups: [oceania]
  note: "Borders here start in the 1870s: before that the source has no states drawn for Australia, New Zealand or the Pacific islands, though people had lived there for tens of thousands of years (Australia) and seven hundred or more (Aotearoa New Zealand)."

# The long-run series (source owid_longrun, through Our World in Data), with what they are.
series:
  population: {name: Population, unit: people, from: "10,000 BC",
               source: "HYDE 3.3 (to 1800), Gapminder and the UN (through Our World in Data)",
               note: "Before 1800 these are reconstructions: estimates of how many people the land could have fed, not counts."}
  gdp_per_capita: {name: GDP per person, unit: "international $ at 2011 prices", from: "AD 1",
                   source: "Maddison Project Database 2023 (through Our World in Data)",
                   note: "Before 1820 only a few countries and years; between them the line is drawn straight."}
  literacy: {name: Literacy, unit: "% of adults", from: "1475", source: "van Zanden et al. and UNESCO (through Our World in Data)"}
  life_expectancy: {name: Life expectancy at birth, unit: years, from: "1543", source: "Riley, Zijdeman and the UN (through Our World in Data)"}
  schooling_years: {name: Years of schooling, unit: "years (adults)", from: "1870", source: "Lee and Lee, Barro and Lee (through Our World in Data)"}
  exports_share_gdp: {name: Merchandise exports, unit: "% of GDP", from: "1827", source: "Fouquin and Hugot, CEPII (through Our World in Data)"}
  military_spending: {name: Military spending, unit: "US$", from: "1816", source: "Correlates of War, SIPRI (through Our World in Data)"}
  military_personnel: {name: Military personnel, unit: people, from: "1816", source: "Correlates of War (through Our World in Data)"}
  urban_share: {name: Urban share, unit: "% of people", from: "1500", source: "HYDE and the UN (through Our World in Data)"}

# The eight factors, rebuilt from free data. A copy of the idea in Ray Dalio's
# "Principles for Dealing with the Changing World Order", not his figures. Each factor is a
# country's share of the total among the countries compared (factor_countries), from the
# series named (multiplied together where there are two), or from hand-dated periods.
factor_countries: [NLD, GBR, USA, CHN, ESP, FRA, DEU, JPN, RUS, IND]
factors:
  - {id: education, name: Education, series: [schooling_years, population],
     how: "Years of schooling times population: how much schooling the country's people have between them."}
  - {id: innovation, name: Innovation and technology, series: [gdp_per_capita],
     how: "Output per person, as a stand-in: free long-run figures for patents or inventions do not exist. Shares of the group total."}
  - {id: competitiveness, name: Cost competitiveness, series: [],
     how: "Not rebuilt: there are no free long-run figures for relative labour costs. Left out of the index."}
  - {id: output, name: Economic output, series: [gdp_per_capita, population],
     how: "GDP per person times population (Maddison): the size of the economy at 2011 prices."}
  - {id: trade, name: Share of world trade, series: [exports_share_gdp, gdp_per_capita, population],
     how: "Merchandise exports as a share of GDP, times GDP: roughly how much the country sells abroad."}
  - {id: military, name: Military strength, series: [military_spending],
     how: "Military spending (Correlates of War before SIPRI)."}
  - {id: financial_centre, name: Financial centre, periods: financial_centres,
     how: "Hand-dated from economic histories: the leading centre scores 1, the runner-up 0.5, shared out."}
  - {id: reserve_currency, name: Reserve currency, periods: reserve_currencies,
     how: "Hand-dated: the main currency central banks and traders held scores 1, the runner-up 0.5, shared out."}

financial_centres:
  - {entity: NLD, from: 1609, to: 1795, rank: 1, note: Amsterdam (Bank of Amsterdam 1609 to the French invasion)}
  - {entity: GBR, from: 1700, to: 1795, rank: 2, note: London rising}
  - {entity: GBR, from: 1796, to: 1918, rank: 1, note: London}
  - {entity: FRA, from: 1815, to: 1914, rank: 2, note: Paris}
  - {entity: USA, from: 1890, to: 1918, rank: 2, note: New York rising}
  - {entity: USA, from: 1919, to: 2030, rank: 1, note: New York}
  - {entity: GBR, from: 1919, to: 2030, rank: 2, note: London}
reserve_currencies:
  - {entity: NLD, from: 1640, to: 1780, rank: 1, note: Dutch guilder}
  - {entity: GBR, from: 1781, to: 1815, rank: 2, note: Pound sterling rising}
  - {entity: GBR, from: 1816, to: 1944, rank: 1, note: Pound sterling}
  - {entity: FRA, from: 1816, to: 1914, rank: 2, note: French franc}
  - {entity: USA, from: 1920, to: 1944, rank: 2, note: US dollar rising}
  - {entity: USA, from: 1945, to: 2030, rank: 1, note: US dollar (Bretton Woods)}
  - {entity: GBR, from: 1945, to: 1970, rank: 2, note: Pound sterling}
  - {entity: DEU, from: 1971, to: 1998, rank: 2, note: Deutsche Mark}
  - {entity: FRA, from: 1999, to: 2030, rank: 2, weight: 0.5, note: The euro (shown under France and Germany, half each)}
  - {entity: DEU, from: 1999, to: 2030, rank: 2, weight: 0.5, note: The euro (shown under France and Germany, half each)}

# The big cycle: where a country might be in the six stages of its internal order, by
# simple rules on today's figures. A rough reading to argue with, not a forecast.
cycle:
  countries: [USA, CHN, GBR, NZL]
  order_began: {USA: 1945, CHN: 1949, GBR: 1945, NZL: 1945, IND: 1947, RUS: 1991, JPN: 1945, DEU: 1949, FRA: 1958, AUS: 1945}
  stages:
    - {n: 1, name: A new order begins, about: "New leaders consolidate power after a revolution, war or collapse."}
    - {n: 2, name: Building the system, about: "Institutions, money and government are set up; growth is fast and debt low."}
    - {n: 3, name: Peace and prosperity, about: "Steady growth, productive borrowing, broadly shared gains."}
    - {n: 4, name: Excess, about: "Debt and inequality build; spending runs ahead of earning; bubbles."}
    - {n: 5, name: Bad finances and intense conflict, about: "Heavy debt, slow growth, a wide gap between rich and poor, bitter politics."}
    - {n: 6, name: Civil war or revolution, about: "The order breaks down; the cycle starts again."}

