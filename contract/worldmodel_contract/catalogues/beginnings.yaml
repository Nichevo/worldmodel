# Which borders a ruler's state counts for, where neither the Wikidata ids nor the names
# match (the borders file splits China and Egypt by dynasty, Wikidata files their rulers
# under one "Chinese Empire" or "Ancient Egypt"). The state's Wikidata id -> border names;
# a name starting with ~ matches any border name holding it. A ruler only counts in the
# years both the reign and the borders cover, so one list can span many dynasties.
ruler_states:
  Q12060881: [Qin Dynasty, Han Dynasty, Xin Dynasty, Western Jin, Eastern Jin, Sui Dynasty, Tang Dynasty, Northern Song,
              Southern Song, Yuan Dynasty, Ming Dynasty, Qing Dynasty]   # Chinese Empire
  Q11768: ["~Egypt", Ptolemaic Kingdom]                                 # Ancient Egypt
  Q1747689: [Roman Kingdom, Roman Republic, Roman Empire, Western Roman Empire]  # Ancient Rome
  Q83958: ["~Macedon"]                                                  # Macedonia
  Q171348: ["~Poland"]                                                  # Crown of the Kingdom of Poland
  Q9391434: ["~Poland"]
  Q104863335: ["~Poland"]
  Q869: ["~Siam", "~Ayutthaya", "~Thailand", "~Rattanakosin"]           # Thailand
  Q424: ["~Khmer", "~Cambodia"]
  Q2638486: ["~Khmer", "~Cambodia"]
  Q146246: ["~Frank", "~Francia"]                                       # Francia
