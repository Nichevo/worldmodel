# Beginnings typed in for the Long history map: religions and beliefs, writing systems and
# languages, each with the year it is usually said to begin, a place, and a short note.
#
# Wikidata holds some of these too, but often with no place (a religion's "location of
# formation" is rarely filled) and almost never for a language, so this list fills the gaps.
# Where an item's Wikidata id is given here, this entry wins over Wikidata's.
#
# Fields:
#   key:       short id (the event id is "bg:<key>")
#   kind:      religion | writing | language
#   title:     as shown on the map
#   year:      negative for BC, no year 0
#   about:     true when the year is a rough one (scholars give a range); shown as "about"
#   end_year:  optional, for a beginning that took a long time
#   lat, lon:  where it began (roughly, for the old ones)
#   place:     the place name shown
#   wikidata:  the item's id, so Wikidata's own copy is not shown twice
#   wiki:      English Wikipedia page name
#   note:      one plain sentence
#
# Dates for the old ones are the usual textbook dates; many are argued about, which is why
# they carry about: true.

beginnings:
