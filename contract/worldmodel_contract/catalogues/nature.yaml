# Pollution and nature: hand-checked lists for the Pollution page, the Climate page's
# Nature tab and the country cards. Dates are to the month where the month is well known,
# otherwise the year. Each item has a link to read more.
checked_until: 2026

# Pests and plant diseases whose spread is followed through EPPO (needs EPPO_API_KEY).
# code is the EPPO code.
pests:
  - {code: HALYHA, name: Brown marmorated stink bug, kind: insect, note: "Eats fruit and crops; New Zealand turns away ships carrying it each season."}
  - {code: DACUTR, name: Queensland fruit fly, kind: insect, note: "Lays eggs in fruit; finds in Auckland have stopped fruit moving out of zones."}
  - {code: CERTCA, name: Mediterranean fruit fly, kind: insect, note: "One of the world's worst fruit pests."}
  - {code: XYLEFA, name: Xylella fastidiosa, kind: bacterium, note: "Kills olive trees, grapes and citrus; has killed millions of olive trees in southern Italy."}
  - {code: LAPHFR, name: Fall armyworm, kind: insect, note: "Caterpillar that eats maize and other crops; spread from the Americas across Africa and Asia from 2016."}
  - {code: LYCMDE, name: Spotted lanternfly, kind: insect, note: "Feeds on grapes and trees; spreading in the eastern United States."}
  - {code: TROGGA, name: Khapra beetle, kind: insect, note: "Eats stored grain; one of the pests borders work hardest to keep out."}
  - {code: PUCCPS, name: Myrtle rust, kind: fungus, note: "Attacks pōhutukawa, rātā, mānuka and eucalypts."}
  - {code: PSDMAK, name: Psa (kiwifruit vine disease), kind: bacterium, note: "Hit New Zealand's kiwifruit industry from 2010."}
  - {code: AGRLPL, name: Emerald ash borer, kind: insect, note: "Has killed hundreds of millions of ash trees in North America."}
  - {code: ANOLGL, name: Asian longhorned beetle, kind: insect, note: "Bores into and kills maples and other broadleaf trees."}
  - {code: BURSXY, name: Pine wood nematode, kind: nematode, note: "Kills pines; a threat to plantation forests."}

