# Climate pledges (each country's NDC under the Paris Agreement, economy-wide targets):
# cut (%) below emissions in base_year by year. The charts mark the point worked out from
# the base year's emissions in the app's series, so it is a guide: pledges count some
# things differently (forests, net or gross).
pledges:
  NZL:
    - {year: 2030, base_year: 2005, cut: 50, note: "Net emissions 50% below gross 2005 emissions (2021 NDC)."}
    - {year: 2035, base_year: 2005, cut: 51, cut_high: 55, note: "51-55% below 2005 (2025 NDC)."}
  AUS:
    - {year: 2030, base_year: 2005, cut: 43, note: "43% below 2005 (2022 NDC)."}
    - {year: 2035, base_year: 2005, cut: 62, cut_high: 70, note: "62-70% below 2005 (2025 NDC)."}
  USA:
    - {year: 2030, base_year: 2005, cut: 50, cut_high: 52, note: "50-52% below 2005 (2021 NDC). The US left the Paris Agreement again in January 2026."}
    - {year: 2035, base_year: 2005, cut: 61, cut_high: 66, note: "61-66% below 2005 (December 2024 NDC), before the US left the Paris Agreement."}
  GBR:
    - {year: 2030, base_year: 1990, cut: 68, note: "At least 68% below 1990 (2020 NDC)."}
    - {year: 2035, base_year: 1990, cut: 81, note: "81% below 1990 (2025 NDC)."}
  eu:
    - {year: 2030, base_year: 1990, cut: 55, note: "At least 55% below 1990, net (2020 NDC)."}
  JPN:
    - {year: 2030, base_year: 2013, cut: 46, note: "46% below the 2013 fiscal year (2021 NDC)."}
    - {year: 2035, base_year: 2013, cut: 60, note: "60% below 2013 (2025 NDC)."}
  CAN:
    - {year: 2030, base_year: 2005, cut: 40, cut_high: 45, note: "40-45% below 2005 (2021 NDC)."}
    - {year: 2035, base_year: 2005, cut: 45, cut_high: 50, note: "45-50% below 2005 (2025 NDC)."}
  KOR:
    - {year: 2030, base_year: 2018, cut: 40, note: "40% below 2018 (2021 NDC)."}

# Species coming back, for the Nature tab's Recovering view.
comebacks:
  - {name: Kākāpō, countries: [NZL], from: "51 birds in 1995", to: "more than 240 by the 2020s", how: "Every bird moved to predator-free islands and cared for one by one.", url: "https://www.doc.govt.nz/kakapo"}
  - {name: Black robin, countries: [NZL], from: "5 birds in 1980, one breeding female (Old Blue)", to: "about 300", how: "Eggs moved to foster parents so pairs laid again.", url: "https://en.wikipedia.org/wiki/Chatham_robin"}
  - {name: Takahē, countries: [NZL], from: "thought extinct until 1948", to: "about 500 by 2023", how: "Breeding, islands and sanctuaries, then back into the wild.", url: "https://www.doc.govt.nz/takahe"}
  - {name: Humpback whale, countries: [], from: "a few thousand after whaling", to: "tens of thousands; Least Concern since 2008", how: "The end of commercial whaling (1986).", url: "https://en.wikipedia.org/wiki/Humpback_whale"}
  - {name: Bald eagle, countries: [USA], from: "about 400 nesting pairs in 1963", to: "off the US endangered list in 2007", how: "DDT banned (1972) and nests protected.", url: "https://en.wikipedia.org/wiki/Bald_eagle"}
  - {name: Iberian lynx, countries: [ESP, PRT], from: "fewer than 100 in 2002", to: "more than 2,000 by 2024; no longer Endangered", how: "Breeding, release and rabbits brought back.", url: "https://en.wikipedia.org/wiki/Iberian_lynx"}
  - {name: Giant panda, countries: [CHN], from: "Endangered", to: "Vulnerable since 2016", how: "Reserves and forest replanting.", url: "https://en.wikipedia.org/wiki/Giant_panda"}
  - {name: Mountain gorilla, countries: [RWA, UGA, COD], from: "about 250 in 1981", to: "more than 1,000; Endangered rather than Critically Endangered since 2018", how: "Ranger patrols and gorilla tourism.", url: "https://en.wikipedia.org/wiki/Mountain_gorilla"}
  - {name: Arabian oryx, countries: [OMN, SAU, ARE, JOR], from: "extinct in the wild in 1972", to: "Vulnerable since 2011", how: "Bred in zoos and released from 1982.", url: "https://en.wikipedia.org/wiki/Arabian_oryx"}
  - {name: California condor, countries: [USA], from: "27 birds in 1987, all taken into captivity", to: "more than 500", how: "Breeding and release.", url: "https://en.wikipedia.org/wiki/California_condor"}
  - {name: Saiga antelope, countries: [KAZ], from: "mass die-off in 2015", to: "close to 2 million; Near Threatened since 2023", how: "Anti-poaching work in Kazakhstan.", url: "https://en.wikipedia.org/wiki/Saiga_antelope"}
  - {name: Tiger in India, countries: [IND], from: "2,967 in 2018", to: "3,682 in 2022", how: "Tiger reserves (Project Tiger, 1973).", url: "https://en.wikipedia.org/wiki/Project_Tiger"}

