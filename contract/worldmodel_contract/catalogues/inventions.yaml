inventions:
  # ------------------------------------------------------------------ before 1500
  - {id: stone-tools, name: Stone tools, year: -3300000, approx: true, category: materials, place: East Africa,
     what: "Sharpened stones for cutting and chopping, the oldest known human-made tools.", wiki: Stone_tool, spread: ["long:population"], related: []}
  - {id: fire, name: Control of fire, year: -1000000, approx: true, category: energy, place: Africa,
     what: "Keeping and making fire, for warmth, light, safety and cooking.", wiki: Control_of_fire_by_early_humans, spread: [], related: ["long:population"]}
  - {id: farming, name: Farming, year: -10000, approx: true, category: food, place: The Fertile Crescent,
     what: "Sowing crops and keeping animals instead of only gathering and hunting; began separately in several places.",
     wiki: Neolithic_Revolution, spread: [], related: ["long:population"],
     link: "Farming fed far more people per square kilometre than foraging, and the world's population grew from a few million."}
  - {id: pottery, name: Pottery, year: -18000, approx: true, category: materials, place: China,
     what: "Fired clay pots for cooking and storing food.", wiki: Pottery, spread: [], related: ["long:population"]}
  - {id: wheel, name: The wheel, year: -3500, approx: true, category: transport, place: Mesopotamia,
     what: "Wheels on an axle, first for potters, then carts.", wiki: Wheel, spread: [], related: ["long:population"]}
  - {id: writing, name: Writing, year: -3200, approx: true, category: communication, place: Mesopotamia (Sumer),
     what: "Marks standing for words and sounds (cuneiform); invented separately in Egypt, China and Mesoamerica.",
     wiki: History_of_writing, spread: ["long:literacy"], related: ["long:population"]}
  - {id: bronze, name: Bronze, year: -3300, approx: true, category: materials, place: The Near East,
