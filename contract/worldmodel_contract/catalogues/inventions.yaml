# ------------------------------------------------------------------ still to come
# Expected inventions, for the Coming next tab. `range` is [earliest, central, late]: a summary of
# the forecasts in `sources` (an expert survey, a roadmap or a forecasting site, with the year
# each said it), never our own forecast. `maybe_never` marks ones that may not happen at all.
# `measures` are today's figures for what it might change (charted up to today, no guessed
# future line); `crowd` is a pattern matched against loaded crowd forecast titles (Metaculus,
# Manifold, Polymarket) to show a live forecast beside the typed-in range; `built_on` names
# typed-in inventions above.
future:
  - id: useful-quantum-computer
    name: Quantum computer that does useful work
    category: computing
    range: [2028, 2032, 2040]
    what: "An error-corrected quantum computer solving a real problem (chemistry, materials) that ordinary computers cannot."
    now: "Machines with a few hundred physical qubits; error correction shown on a small scale (Google, 2024)."
    sources:
      - {name: "IBM quantum roadmap", year: 2025, says: "Starling, about 200 error-corrected qubits, planned for 2029."}
      - {name: "Google Quantum AI", year: 2025, says: "Aims for a useful error-corrected computer by the end of the decade."}
    effects: "Might speed up the design of drugs, catalysts and batteries; little change to everyday computing."
    measures: [rd_spending_gdp, high_tech_share_exports]
    crowd: "quantum (advantage|supremacy)|logical qubits?|fault.tolerant quantum|useful quantum"
    built_on: [transistor, microchip]
    wiki: Quantum_computing
  - id: quantum-codebreaker
    name: Quantum computer that breaks today's encryption
    category: computing
    range: [2030, 2037, 2050]
    what: "A quantum computer big enough to break the public-key encryption that protects the internet and banking."
    now: "Far beyond today's machines; new quantum-safe encryption standards were published in 2024 (NIST)."
    sources:
      - {name: "Global Risk Institute, Quantum Threat Timeline Report", year: 2025, says: "About half the experts asked think it is likely within 10 to 15 years."}
      - {name: "NIST", year: 2024, says: "Plans to retire today's vulnerable encryption by 2035."}
    effects: "Old encrypted data could be read; banks, governments and websites must switch to quantum-safe encryption first."
    measures: []
    crowd: "\\brsa\\b|break.*encryption|\\bshor"
    built_on: [arpanet, web]
    wiki: Post-quantum_cryptography
  - id: human-level-ai
    name: AI as capable as people at every task
    category: computing
    range: [2028, 2047, 2075]
    what: "Machines that can do every task better and more cheaply than human workers."
    now: "Large language models write, code and answer questions; companies are rolling them out at work."
    sources:
      - {name: "AI Impacts survey of 2,778 AI researchers", year: 2023, says: "50% chance by 2047, 10% by 2027 (published 2024)."}
      - {name: "Metaculus forecasters", year: 2025, says: "Much earlier, around the early 2030s, for their definition of general AI."}
    effects: "Might raise output per worker sharply and change which jobs exist; the effect on wages and unemployment is disputed."
    measures: [gdp_per_worker, unemployment, ai_use_enterprises]
    crowd: "\\bagi\\b|artificial general intelligence|general ai|human-level|transformative ai"
    built_on: [transformer-ai, deep-learning]
    wiki: Artificial_general_intelligence
  - id: humanoid-robots
    name: Humanoid robots in homes and workplaces
    category: home
    range: [2028, 2035, 2050]
    what: "General-purpose robots in human shape doing chores, warehouse and factory work."
    now: "Pilots in car factories and warehouses (Figure, Agility, Tesla Optimus); first home robots offered for pre-order."
    sources:
      - {name: "Company plans (Figure, 1X, Tesla)", year: 2025, says: "Home robots on sale from the late 2020s."}
    effects: "Might take over physical chores and some manual jobs; adds to what software AI can do."
    measures: [labour_participation, employment_services_share]
    crowd: "humanoid robot|optimus"
    built_on: [transformer-ai, lithium-battery]
    wiki: Humanoid_robot
  - id: quantum-internet
    name: Quantum internet
    category: communication
    range: [2035, 2040, 2060]
    what: "Networks that send quantum states between distant quantum computers, with eavesdropping detectable by physics."
    now: "Short city links and a China-Austria satellite link (2017); no network of quantum computers yet."
    sources:
      - {name: "EU Quantum Internet Alliance", year: 2024, says: "A prototype network linking cities in Europe in the 2030s."}
    effects: "Might make some communication impossible to intercept unseen and link quantum computers together."
    measures: []
    crowd: "quantum internet|quantum network"
    built_on: [laser, satellite]
    wiki: Quantum_network
  - id: fusion-power
    name: Fusion power on the grid
    category: energy
    range: [2032, 2040, 2060]
    what: "Power stations that make electricity by fusing hydrogen, as the Sun does."
