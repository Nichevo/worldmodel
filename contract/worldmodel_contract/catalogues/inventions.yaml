# Inventions over time (Explore > Inventions), typed in from Wikipedia.
#
# Each invention: its year (negative for BC; approx: true where only roughly known), category,
# place and the country it is credited to (ISO3, or none), who made it, one line on what it is,
# its English Wikipedia article, and the series charted on its card:
#   spread   how the invention itself spread (share of homes with it, users, output)
#   related  changes seen around the same time, with `link`: one line on how they connect.
# Series: an indicator id reads the yearly series table; "long:<id>" reads the long-run table
# (Our World in Data long-run charts, source owid_longrun). A category's `related` is used when
# an invention gives none of its own.
#
# The page never says an invention caused the changes charted: many things change at once.
# Dates are the usual "first working version" date on Wikipedia; spreading often took decades.

categories:
  - id: energy
    name: Energy
    related: ["long:gdp_per_capita", energy_use_per_capita, "long:energy_coal"]
  - id: transport
    name: Transport
    related: ["long:gdp_per_capita", "long:urban_share", "long:exports_share_gdp"]
  - id: medicine
    name: Medicine and health
    related: ["long:life_expectancy", "long:child_mortality"]
  - id: communication
    name: Communication
    related: ["long:literacy", internet_users_share]
  - id: food
    name: Food and farming
    related: ["long:wheat_yield", cereal_yield, "long:population"]
  - id: computing
    name: Computing
    related: [internet_users_share, gdp_per_worker, "long:transistors"]
  - id: materials
    name: Materials and making
    related: ["long:gdp_per_capita", "long:urban_share"]
  - id: science
    name: Science and measuring
    related: ["long:life_expectancy", "long:gdp_per_capita"]
  - id: home
    name: Home and everyday life
    related: [labour_participation_female, "long:fertility_rate"]
  - id: money
    name: Money and trade
    related: ["long:exports_share_gdp", trade_share_gdp, "long:gdp_per_capita"]

