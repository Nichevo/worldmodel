  - id: cement
    name: Cement
    group: made
    feeds: Concrete for buildings, roads and dams; about 7% of the world's CO2 emissions. China makes about half of it. Heavy and cheap, so little is traded far.
    sources: USGS; BACI.
    stages:
      - {id: clinker, name: "Cement clinker", hs: ["252310"]}
      - id: cement
        name: Cement
        hs: ["252321", "252329", "252330", "252390"]
        production: {usgs: "cement|"}
        how:
          inputs: About 1.5 tonnes of limestone and clay, with some sand and iron ore, per tonne of clinker; cement is clinker ground with gypsum and fillers such as fly ash or slag.
          energy: A kiln at about 1,450 °C, burning coal, gas or waste; about 0.6 tonnes of CO2 per tonne of cement, over half of it from the limestone itself.
          time: Hours in the kiln.
          waste: Kiln dust; dust and noise at quarries.
    companies:
      - {name: Anhui Conch, country: CHN, step: cement}
      - {name: CNBM (China National Building Material), country: CHN, step: cement}
      - {name: Holcim, country: CHE, step: cement}
      - {name: Heidelberg Materials, country: DEU, step: cement}
      - {name: Golden Bay Cement (Fletcher Building), country: NZL, step: cement, nz: true}

# Rough materials in a battery pack, kg per kWh of capacity, by chemistry. Approximate,
