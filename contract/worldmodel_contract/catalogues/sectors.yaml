sectors:
  - id: aluminium
    name: Aluminium
    group: metals
    feeds: Cars, trucks and planes; packaging (cans, foil); building (windows, cladding); power lines; machinery and consumer goods.
    sources: International Aluminium Institute; USGS Mineral Commodity Summaries; EU reference document on best available techniques for non-ferrous metals.
    prices: [aluminium]
    stages:
      - id: bauxite
        name: Bauxite (ore)
        hs: ["2606"]
        production: {wmd: Bauxite, usgs: "bauxite|mine"}
        how:
          inputs: Mined from open pits, mostly in the tropics (Australia, Guinea, China, Brazil, Indonesia).
          energy: Diesel for digging and hauling; little else.
          time: Weeks from mine to ship.
          waste: Overburden and mine rehabilitation; dust and water run-off.
      - id: alumina
        name: Alumina (aluminium oxide)
        hs: ["281820"]
        production: {wmd: Alumina, usgs: "bauxite|refinery"}
        how:
          inputs: About 2.5 to 3 tonnes of bauxite and caustic soda per tonne of alumina (the Bayer process).
          energy: Mostly heat for digesting the ore at 150 to 250 °C, from gas, coal or oil; about 8 to 12 GJ per tonne.
          time: About a day through a refinery.
          waste: About 1 to 1.5 tonnes of red mud (bauxite residue) per tonne, stored in large ponds; a little is used in cement and bricks.
      - id: aluminium
        name: Primary aluminium
        hs: ["7601"]
        production: {wmd: Aluminium, usgs: "aluminum|smelter"}
        how:
          inputs: About 1.9 to 2 tonnes of alumina and 0.4 to 0.45 tonnes of carbon anodes per tonne of aluminium (the Hall-Héroult process).
          energy: About 13 to 15 MWh of electricity per tonne, so the power source decides most of the emissions, from about 4 tonnes of CO2 per tonne with hydro (as at Tiwai Point) to 15 to 20 with coal power.
          time: Smelting runs day and night; a pot line cannot be stopped and restarted cheaply.
          waste: CO2 from the anodes, perfluorocarbons (strong greenhouse gases) during upsets, spent pot lining (hazardous), and dross.
      - id: aluminium_products
        name: Aluminium products (sheet, foil, extrusions, wire)
        hs: ["7603", "7604", "7605", "7606", "7607", "7608", "7609", "7610", "7611", "7612", "7613", "7614", "7615", "7616"]
        how:
          inputs: Primary metal and scrap; recycled aluminium needs about 5% of the energy of new metal.
          energy: Gas for remelting and reheating; electricity for rolling and extruding.
          time: Days to weeks.
          waste: Offcuts go back as scrap; dross from melting.
    companies:
      - {name: Chalco (Aluminum Corporation of China), country: CHN, step: alumina, note: "Bauxite, alumina and aluminium"}
      - {name: China Hongqiao, country: CHN, step: aluminium}
      - {name: Rusal, country: RUS, step: aluminium}
      - {name: Rio Tinto, country: AUS, step: aluminium, note: "Bauxite in Australia and Guinea, alumina and smelters; majority owner of Tiwai Point"}
      - {name: Alcoa, country: USA, step: alumina}
      - {name: Emirates Global Aluminium, country: ARE, step: aluminium}
      - {name: Norsk Hydro, country: NOR, step: aluminium}
      - {name: New Zealand Aluminium Smelters (Tiwai Point), country: NZL, step: aluminium, note: "Owned by Rio Tinto (79.36%) and Sumitomo Chemical (20.64%); hydro power from Manapōuri", nz: true}

  - id: steel
    name: Iron and steel
    group: metals
    feeds: Building and infrastructure (about half), machinery, cars and ships, appliances, tools and packaging.
    sources: worldsteel; USGS Mineral Commodity Summaries; EU reference document on best available techniques for iron and steel; IEA Iron and Steel Technology Roadmap.
    prices: [iron_ore]
    stages:
      - id: iron_ore
        name: Iron ore
        hs: ["2601"]
        production: {wmd: Iron, usgs: "iron ore|mine"}
        how:
          inputs: Mined from open pits (Australia, Brazil, China, India); some is concentrated and made into pellets.
          energy: Diesel and electricity for mining, crushing and pelletising.
          time: Weeks from mine to ship.
          waste: Tailings from concentrating lower-grade ore; overburden.
      - id: pig_iron
        name: Pig iron and direct reduced iron
        hs: ["7201", "7203"]
        production: {usgs: "iron and steel|pig iron"}
        how:
          inputs: About 1.5 to 1.6 tonnes of iron ore and 0.4 to 0.5 tonnes of coke (from coking coal) per tonne of iron in a blast furnace; or gas (or coal, as at Glenbrook from ironsand) in direct reduction.
          energy: Coal and coke supply both heat and the carbon that strips oxygen from the ore.
          time: Hours through a blast furnace, which runs for 15 to 20 years between relinings.
          waste: About 0.25 to 0.3 tonnes of slag per tonne, mostly used in cement and roads; CO2 is the main emission.
      - id: crude_steel
        name: Crude and semi-finished steel
        hs: ["7206", "7207", "7218", "7224"]
        production: {wmd: Steel, usgs: "iron and steel|raw steel"}
        how:
          inputs: Iron plus scrap in a basic oxygen furnace (about 80% iron, 20% scrap), or mostly scrap (or direct reduced iron) in an electric arc furnace.
          energy: The blast furnace and oxygen route gives about 2 tonnes of CO2 per tonne of steel; the scrap and electric arc route about 0.4 to 0.7 tonnes, depending on the power.
          time: A heat of steel takes about 40 minutes in a converter, about an hour in an arc furnace.
          waste: Steel slag, dust (with zinc from coated scrap), mill scale.
      - id: steel_products
        name: Steel products (flat, long, tubes)
        hs: ["7208", "7209", "7210", "7211", "7212", "7213", "7214", "7215", "7216", "7217", "7219", "7220", "7221", "7222", "7225", "7226", "7227", "7228", "7304", "7305", "7306", "7308"]
        how:
          inputs: Slabs, billets and blooms rolled hot and cold, then coated or formed.
          energy: Gas for reheating, electricity for rolling.
          time: Days.
          waste: Offcuts back to the furnace as scrap; mill scale; pickling acids.
    companies:
      - {name: China Baowu Steel, country: CHN, step: crude_steel}
      - {name: ArcelorMittal, country: LUX, step: crude_steel}
      - {name: Nippon Steel, country: JPN, step: crude_steel}
      - {name: HBIS Group, country: CHN, step: crude_steel}
      - {name: POSCO, country: KOR, step: crude_steel}
      - {name: Vale, country: BRA, step: iron_ore}
      - {name: BHP, country: AUS, step: iron_ore}
      - {name: Fortescue, country: AUS, step: iron_ore}
      - {name: NZ Steel (BlueScope), country: NZL, step: crude_steel, note: "Glenbrook mill makes iron from Waikato North Head ironsand; an electric arc furnace co-funded with the government is due to replace part of it", nz: true}

