  - id: lithium
    name: Lithium
    group: battery
    feeds: Batteries (most of it now), glass and ceramics, greases.
    sources: USGS Mineral Commodity Summaries; IEA Critical Minerals Data Explorer.
    stages:
      - id: lithium_raw
        name: Lithium mined (content)
        hs: ["253090"]
        production: {wmd: Lithium, usgs: "lithium|mine"}
        how:
          inputs: Hard rock (spodumene, mostly Australia) or brine pumped into evaporation ponds (Chile, Argentina).
          energy: Brine uses sun for evaporation over 12 to 18 months; hard rock needs heat for roasting, often from coal in China.
          time: 1 to 2 years for brine; weeks for rock.
          waste: Water use in dry places (brine); tailings (rock).
      - id: lithium_chemicals
        name: Lithium carbonate and hydroxide
        hs: ["283691", "282520"]
        how:
          inputs: Spodumene concentrate or brine, plus acids and soda ash.
          energy: Heat and electricity; most refining is in China.
          time: Days.
          waste: Sodium sulfate and leach residue.
    companies:
      - {name: Albemarle, country: USA, step: lithium_chemicals}
      - {name: SQM, country: CHL, step: lithium_raw}
      - {name: Ganfeng Lithium, country: CHN, step: lithium_chemicals}
      - {name: Tianqi Lithium, country: CHN, step: lithium_chemicals}
      - {name: Pilbara Minerals, country: AUS, step: lithium_raw}

