# Sectors: one industry across the globe, followed stage by stage.
#
# Each sector is a chain of stages (ore -> refined -> metal -> products). A stage has
#   hs          HS 1992 codes (2, 4 or 6 digits; a shorter code takes every code under it)
#               whose trade is summed from CEPII BACI for that stage
#   production  where its production by country comes from, best first:
#                 fao: FAOSTAT item (and element, default Production)
#                 wmd: World Mining Data sheet name (matched loosely)
#                 usgs: "COMMODITY|type words" in USGS Mineral Commodity Summaries
#                 indicator: an indicator already in the catalogue (OWID energy and so on)
#   unit        unit of production (tonnes unless said)
#   how         hand-written notes on how the step works: inputs per tonne, energy,
#               time, by-products and waste. Rough figures, rounded, with sources in
#               the sector's `sources`; checked by hand like the leaders list.
# A sector also lists what it feeds into, its price series (World Bank Pink Sheet ids,
# see sector_prices below), and key companies (hand-checked once a year; nz: true marks
# New Zealand's own players). Adding a sector is adding an entry here.
#
# HS codes are the 1992 edition so that trade lines up from 1995 on: some newer
# products (lithium-ion cells, electric cars) sit inside wider 1992 codes.

groups:
  metals: Metals
  battery: Battery and critical minerals
  energy: Energy
  fertilizer: Fertilizer
  food: Food and farming
  forestry: Forestry
  made: Made goods

