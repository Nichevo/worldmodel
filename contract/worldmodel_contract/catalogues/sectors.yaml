  - id: cars
    name: Cars
    group: made
    kind: made
    feeds: Personal transport; the car industry is one of the biggest buyers of steel, aluminium, plastics, glass, rubber and chips, and now of battery metals.
    sources: OICA; IEA Global EV Outlook; ACEA; BACI.
    stages:
      - {id: car_parts, name: "Car parts and bodies", hs: ["8706", "8707", "8708"]}
      - id: cars
        name: Passenger cars
        hs: ["8703"]
        how:
          inputs: An average new car weighs about 1.4 to 1.5 tonnes, about 0.8 to 0.9 tonnes of it steel, 0.15 to 0.2 tonnes aluminium and about as much plastic; an electric car adds a battery pack of 300 to 500 kg.
          energy: Making the car (without battery) gives roughly 5 to 10 tonnes of CO2; a battery adds roughly 60 to 100 kg per kWh, depending on the power used to make the cells.
          time: About 20 to 30 hours of assembly work per car; weeks by ship to New Zealand.
          waste: Paint shop solvents and sludge; at end of life about 75 to 85% of a car's weight is recycled.
    companies:
      - {name: Toyota, country: JPN, step: cars}
      - {name: Volkswagen Group, country: DEU, step: cars}
      - {name: Hyundai Motor Group, country: KOR, step: cars}
      - {name: BYD, country: CHN, step: cars}
      - {name: Stellantis, country: NLD, step: cars}
      - {name: General Motors, country: USA, step: cars}
      - {name: Tesla, country: USA, step: cars}

  - id: semiconductors
    name: Semiconductors (chips)
    group: made
    feeds: Phones and computers, data centres and AI, cars (a modern car has over a thousand chips), power electronics, telecoms and defence.
    sources: BACI; Semiconductor Industry Association; company annual reports; US and EU export-control notices.
    stages:
      - id: wafers
        name: Silicon wafers
        hs: ["381800"]
        how:
          inputs: Polysilicon over 99.9999999% pure, grown into single-crystal ingots and sliced into wafers 300 mm across.
          energy: Crystal growing and purifying silicon use a lot of electricity, much of it in China.
          time: Days for an ingot.
          waste: Silicon dust and slurry from slicing; chlorosilanes from purifying.
      - id: chips
        name: Integrated circuits (chips)
        hs: ["8542"]
        how:
          inputs: Wafers, ultra-pure water and gases, photoresists and other chemicals; the most advanced chips need extreme-ultraviolet lithography machines that only ASML makes.
          energy: A large fab uses as much electricity as a small city, and much water.
          time: About three months from bare wafer to finished chip, with hundreds of steps; then testing and packaging, mostly in Asia.
          waste: Fluorinated greenhouse gases, used acids and solvents, wastewater.
      - {id: discrete_semis, name: "Transistors, diodes and other discrete devices (with LEDs)", hs: ["854110", "854121", "854129", "854130", "854150", "854160", "854190"]}
    companies:
      - {name: TSMC, country: TWN, step: chips, note: "The biggest contract chip maker, and most of the world's most advanced chips"}
      - {name: Samsung Electronics, country: KOR, step: chips, note: "Memory and contract manufacturing"}
      - {name: SK hynix, country: KOR, step: chips, note: "Memory, including high-bandwidth memory for AI"}
      - {name: Intel, country: USA, step: chips}
      - {name: Micron, country: USA, step: chips, note: "Memory"}
      - {name: SMIC, country: CHN, step: chips}
      - {name: Nvidia, country: USA, step: chips, note: "Designs AI chips; TSMC makes them"}
      - {name: ASML, country: NLD, step: chips, note: "The only maker of extreme-ultraviolet lithography machines"}
      - {name: Shin-Etsu Chemical, country: JPN, step: wafers}
      - {name: SUMCO, country: JPN, step: wafers}

