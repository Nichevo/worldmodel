# Rough materials in a battery pack, kg per kWh of capacity, by chemistry. Approximate,
# rounded from IEA and Argonne estimates; they vary by cell design.
battery_materials:
  - {chemistry: NMC 811, lithium: 0.1, nickel: 0.75, cobalt: 0.09, manganese: 0.09, graphite: 1.0}
  - {chemistry: NMC 622, lithium: 0.12, nickel: 0.6, cobalt: 0.2, manganese: 0.19, graphite: 1.0}
  - {chemistry: LFP, lithium: 0.1, nickel: 0, cobalt: 0, manganese: 0, graphite: 1.1}
battery_material_sectors: {lithium: lithium, nickel: nickel, cobalt: cobalt, manganese: manganese, graphite: graphite}

# Export limits and rules on battery materials (hand-checked; dates are when they took effect).
battery_rules:
  - {country: IDN, year: 2020, text: "Indonesia bans exports of nickel ore, to build refining at home."}
