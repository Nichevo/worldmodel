  - id: oil
    name: Crude oil and refined products
    group: energy
    feeds: Transport fuels, plastics and chemicals, heating, power in some places, asphalt.
    sources: Energy Institute Statistical Review (via Our World in Data); IEA.
    prices: [crude_oil]
    stages:
      - {id: crude_oil, name: "Crude oil", hs: ["2709"], production: {indicator: oil_production}, unit: TWh}
      - id: refined_products
        name: Refined products (petrol, diesel, jet fuel)
        hs: ["2710"]
        how:
          inputs: Crude oil; a refinery splits it by boiling point and cracks heavy parts into lighter fuels.
          energy: About 5 to 8% of the oil's energy is used in refining.
          time: Hours through the units; crude is shipped weeks ahead.
          waste: CO2, sulfur (recovered and sold), sour water and spent catalysts.
    companies:
