  - id: fertilizer_n
    name: Nitrogen fertilizer
    group: fertilizer
    feeds: Crops, above all cereals; also explosives and industrial chemicals.
    sources: International Fertilizer Association; FAOSTAT; IEA Ammonia Technology Roadmap.
    prices: [urea]
    stages:
      - id: ammonia
        name: Ammonia
        hs: ["281410"]
        production: {usgs: "nitrogen|plant"}
        how:
          inputs: Hydrogen from natural gas (or coal in China) and nitrogen from the air, combined at high pressure (the Haber-Bosch process).
          energy: About 28 to 36 GJ of gas per tonne of ammonia; making it is roughly 1 to 2% of the world's energy use.
          time: Continuous; plants run for years between major stops.
          waste: About 1.8 to 2.4 tonnes of CO2 per tonne from gas (much more from coal); some CO2 is reused to make urea.
      - id: urea
        name: Urea and other nitrogen fertilizers
        hs: ["310210", "310221", "310230", "310280", "310290"]
        production: {fao: "Nutrient nitrogen N (total)"}
        unit: tonnes of nitrogen
        how:
          inputs: About 0.57 tonnes of ammonia and 0.73 tonnes of CO2 per tonne of urea.
          energy: Steam and electricity at the same site as the ammonia.
          time: Hours.
          waste: Ammonia and dust; nitrous oxide on farms after spreading.
    companies:
      - {name: Yara, country: NOR, step: ammonia}
      - {name: CF Industries, country: USA, step: ammonia}
      - {name: Nutrien, country: CAN, step: ammonia}
      - {name: Ballance Agri-Nutrients, country: NZL, step: urea, note: "Kapuni ammonia-urea plant in Taranaki", nz: true}
      - {name: Ravensdown, country: NZL, step: urea, note: "Imports and distributes fertilizer", nz: true}

  - id: fertilizer_p
    name: Phosphate fertilizer
    group: fertilizer
    feeds: Crops and pasture; also animal feed and detergents.
    sources: International Fertilizer Association; FAOSTAT; USGS.
    prices: [phosphate_rock, dap, tsp]
    stages:
      - {id: phosphate_rock, name: "Phosphate rock", hs: ["2510"], production: {wmd: Phosphate, usgs: "phosphate rock|mine"}}
      - id: phosphate_fertilizer
        name: Phosphate fertilizers (DAP, MAP, superphosphate)
        hs: ["310310", "310390", "310530", "310540"]
        production: {fao: "Nutrient phosphate P2O5 (total)"}
        unit: tonnes of P2O5
        how:
          inputs: Phosphate rock dissolved in sulfuric acid to make phosphoric acid, then mixed with ammonia (DAP, MAP); superphosphate (common in New Zealand) is rock treated with acid directly.
          energy: The sulfuric acid plant makes more heat than it uses.
          time: Days.
          waste: About 4.5 to 5 tonnes of phosphogypsum per tonne of P2O5, mostly stacked; fluorine compounds; cadmium in some rock.
    companies:
      - {name: OCP Group, country: MAR, step: phosphate_rock}
      - {name: Mosaic, country: USA, step: phosphate_fertilizer}
      - {name: PhosAgro, country: RUS, step: phosphate_fertilizer}
      - {name: Ballance Agri-Nutrients, country: NZL, step: phosphate_fertilizer, note: "Superphosphate works at Awarua and Mount Maunganui", nz: true}
      - {name: Ravensdown, country: NZL, step: phosphate_fertilizer, note: "Superphosphate works at Napier, Christchurch and Dunedin", nz: true}

